<style>

html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh}

.wrap{max-width:880px;margin:0 auto;padding:20px 16px 120px}

#term,#plain,#agent{display:none}
body[data-view=terminal] #term,body[data-view=plain] #plain,body[data-view=agent] #agent{display:block}
.msg{display:flex;gap:10px;margin:0 0 16px}
.av{flex:none;width:30px;height:30px;border:1px solid var(--acc);color:var(--acc);border-radius:50%;display:grid;place-items:center;font-size:12px}

.dots i{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--dim);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.2}}
#ask{display:flex;gap:8px;margin-top:16px}

 {id:'spec-driven-build', title:'Spec-driven build', line:'A reviewed spec as the single source of truth for design, build, tests, observability and ops.',

const C = {
 about: () => `<p>Lead software engineer at a global bank, working on the decisioning platforms behind auto lending. I own technical delivery for a core system with <span class="acc">30+ capabilities, 800 fields and 50+ entities</span>, where every design call carries real business impact.</p>
  <p>I’m a <span class="acc">generalising specialist</span>: deep in whatever problem I’m on, broad across infrastructure, SRE, performance, UI and AI-assisted delivery. Joined in 2018 through an early-career program; Lead in 2025.</p>

   <h3><span class="y">2018 — 2025</span> · Software Engineer → Lead</h3>

  </dl>`,

  '<b>Frame decisions commercially</b> — value delivered, cost avoided, risk reduced.',

  '<b>Responsible AI is structure, not just tooling</b> — specs, determinism where it matters, the right model per task.',
  '<b>Mentor the thinking, not the answer</b> — pair constructive feedback with recognition of effort.'])}

const projHTML = p => `<h3>${p.title} <span class="dim">· ${p.id}</span></h3>${p.body.map(b=>`<p>${b}</p>`).join('')}${ul(p.facts)}${tags(p.stack)}`;

const out = document.getElementById('out'), inp = document.getElementById('in');
const block = html => { const d=document.createElement('div'); d.className='out-block'; d.innerHTML=html; out.appendChild(d); scrollTo(0,document.body.scrollHeight); };
const text  = t => { const d=document.createElement('div'); d.textContent=t; out.appendChild(d); };

const CMDS = {

   <dt>projects</dt><dd>selected work, anonymised</dd><dt>skills</dt><dd>stack</dd><dt>principles</dt><dd>how I make engineering decisions</dd>
   <dt>life</dt><dd>outside work</dd><dt>contact</dt><dd>get in touch</dd>

 about: () => sect('about', C.about()),
 experience: () => sect('experience', C.experience()),
 projects: () => sect('projects', projList()),
 skills: () => sect('skills', C.skills()),
 principles: () => sect('principles', C.principles()),
 life: () => sect('life', C.life()),
 contact: () => sect('contact', C.contact()),

   if(!FILES[f]) f = FILES[f+'.md']?f+'.md':(FILES['projects/'+f+'.md']?'projects/'+f+'.md':f);
   if(!FILES[f]) return text(`cat: ${a[0]}: No such file or directory`);
   block(FILES[f]()); },
 open: a => CMDS.cat(a),
 plain: () => setView('plain'),
 guide: () => setView('agent'),
 theme: () => toggleTheme(),
 clear: () => { out.innerHTML=''; },
 sudo: () => text('guest is not in the sudoers file. This incident will be reported.'),
 pwd: () => text('/home/guest'),
 echo: a => text(a.join(' '))
};
const NAMES = Object.keys(CMDS), FILENAMES = Object.keys(FILES);

const history=[]; let hi=0;
function run(line){
  line=line.trim(); if(!line) return;
  const d=document.createElement('div'); d.className='cmd'; d.innerHTML=`<span class="p">guest@dj:<b>~</b>$</span> `; d.append(line); out.appendChild(d);
  history.push(line); hi=history.length;
  const [c,...a]=line.split(/\s+/);
  (CMDS[c.toLowerCase()] || (()=>text(`${c}: command not found. Try "help".`)))(a);
  scrollTo(0,document.body.scrollHeight);
}
inp.addEventListener('keydown', e => {
  if(e.key==='Enter'){ run(inp.value); inp.value=''; }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(hi>0) inp.value=history[--hi]; }
  else if(e.key==='ArrowDown'){ e.preventDefault(); inp.value = hi<history.length-1 ? history[++hi] : (hi=history.length,''); }
  else if(e.key==='Tab'){ e.preventDefault();
    const parts=inp.value.split(/\s+/), last=parts.pop(), pool = parts.length ? FILENAMES.concat(PROJECTS.map(p=>p.id)) : NAMES;
    const m=pool.filter(x=>x.startsWith(last)); if(m.length===1) inp.value=parts.concat(m[0]).join(' '); }
  else if(e.key==='l' && e.ctrlKey){ e.preventDefault(); CMDS.clear(); }
});
document.getElementById('term').addEventListener('click', e => { if(!e.target.closest('button,a') && !getSelection().toString()) inp.focus(); });

function answerFor(s){
  const toks=s.toLowerCase().match(/[a-z0-9-]+/g)||[]; let best=null,top=0;
  for(const e of KB){ const n=e.k.filter(k=>toks.some(t=>hit(t,k))).length; if(n>top){top=n;best=e;} }
  return best&&best.a;
}
function msg(who,html){ const d=document.createElement('div'); d.className='msg'+(who==='me'?' me':'');
  d.innerHTML=who==='me'?`<div class="bub"></div>`:`<div class="av" aria-hidden="true">DJ</div><div class="bub a"></div>`;
  const b=d.querySelector('.bub'); who==='me'?b.textContent=html:b.innerHTML=html; chat.appendChild(d); return d; }
function setChips(list){ achips.innerHTML=''; list.forEach(([l,f])=>{const b=document.createElement('button'); b.type='button'; b.textContent=l; b.onclick=f; achips.appendChild(b);}); }
// Streams text node by node, a few words per tick, so the reply reads like a model generating.
function stream(el,done){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  const full=nodes.map(n=>n.nodeValue); nodes.forEach(n=>n.nodeValue='');
  let i=0,j=0; const words=full.map(s=>s.match(/\S+\s*|\s+/g)||[]);
  (function tick(){ if(i>=nodes.length) return done();
    const n=1+Math.floor(Math.random()*3); nodes[i].nodeValue+=words[i].slice(j,j+n).join(''); j+=n;
    if(j>=words[i].length){i++;j=0;}
    scrollTo(0,document.body.scrollHeight); setTimeout(tick,18+Math.random()*30); })();
}
function say(html,chips){ setChips([]);
  const t=msg('bot','<span class="dots" aria-label="thinking"><i></i><i></i><i></i></span>');
  const finish=()=>{ setChips(chips()); scrollTo({top:document.body.scrollHeight,behavior:calm?'auto':'smooth'}); };
  setTimeout(()=>{ const b=t.querySelector('.bub'); b.innerHTML=html; calm?finish():stream(b,finish); }, calm?0:500+Math.random()*500); }
const SUGG=[['What has he achieved?','results'],['How does he use AI?','ai agents llm'],['Performance wins','latency performance'],['How does he lead?','mentor leadership'],['What breaks gracefully?','resilience outage'],['Why not just use sequences?','uuid sequence'],['How does he test?','test regression'],['Tell me about alerts','observability alert'],['What’s his stack?','skills stack'],['Life outside work','life'],['Contact','contact']];
const seen=new Set();
const sugg=()=>{ const pool=SUGG.filter(([,s])=>!seen.has(s)).sort(()=>Math.random()-.5).slice(0,3);
  return pool.map(([l,s])=>[l,()=>ask(s,l)]).concat([[tour<0?'Take the tour':'Resume tour',()=>go(Math.max(tour,0)+(tour<0?0:1))]]); };
const NOPE=["That one's not in the brief, and I won't improvise on someone else's CV. Here's what I do know:","I checked. Nothing on that. I'd rather admit a gap than invent a tech stack. Try one of these:"];
const REAL=`<p>Fair question. I'm a guide built into this page: I answer from Dattamber's own write-ups instead of improvising, which, given the audience, seemed wise. If you want the improvised version, he's reachable in person.</p>`;
function ask(s,label){ s=s.trim(); if(!s) return; msg('me',label||s); seen.add(s);
  if(/\b(real|llm|bot|human|chatgpt|gpt|claude|live)\b/i.test(s)) return say(REAL+C.contact(),sugg);
  const a=answerFor(s);
  say(a?a():`<p>${NOPE[Math.random()*NOPE.length|0]}</p>`, sugg); }
let tour=-1;
const STEPS=[
 ()=>`<p>Quick version of Dattamber: a lead engineer who makes critical systems <span class="acc">faster, more resilient and easier to run</span>, and makes AI-assisted delivery repeatable.</p>${C.about()}`,
 ()=>`<p>Right now he's the technical lead for the platforms behind auto-lending decisioning.</p>${C.experience()}`,
 ()=>`<p>The numbers, since that's what matters:</p>${stats}`,
 ()=>`<p>Here is how he decides things:</p>${C.principles()}${mentor}`,
 ()=>`<p>Selected work. Pick one to open it:</p>${projList()}`,
 ()=>`<p>And the human side:</p>${C.life()}`,
 ()=>`<p>That's the tour. No quiz at the end. If this sounds useful, say hello:</p>${C.contact()}`
];
function go(i){ tour=i; if(i>=STEPS.length){tour=-1; return say('<p>Tour finished. Ask me anything else.</p>',sugg);}
  say(STEPS[i](),()=>[[i<STEPS.length-1?'Next →':'Finish',()=>go(i+1)],['Ask a question',()=>setChips(SUGG.map(([l,s])=>[l,()=>ask(s,l)]))],['End tour',()=>{tour=-1;say('<p>Ok, over to you. Pick a topic or type a question.</p>',sugg);}]]); }
document.getElementById('ask').onsubmit=e=>{e.preventDefault(); const v=q.value; q.value=''; ask(v);};

say(`<p>Hi, I'm DJ's guide. Dattamber is busy keeping critical systems upright, so I'm covering the introductions.</p><p>I can walk you through his work in two minutes, or take questions. Skip the small talk; I won't mind.</p>`,
  ()=>[['Start the 2-minute tour',()=>go(0)],...SUGG.slice(0,4).map(([l,s])=>[l,()=>ask(s,l)])]);

function toggleTheme(){
  const r=document.documentElement, t=r.dataset.theme==='light'?'dark':'light'; r.dataset.theme=t;
  try{localStorage.setItem('theme',t)}catch(_){}
}
document.getElementById('tTheme').onclick=toggleTheme;
try{ const t=localStorage.getItem('theme'); if(t) document.documentElement.dataset.theme=t;
     else if(matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme='light'; }catch(_){}

// Boot
text(`dj-os 1.0 — type "help" to explore`);
CMDS.whoami();
setView('agent');
</script>
