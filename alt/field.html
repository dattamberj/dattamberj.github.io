<!doctype html>
<html lang="en" data-nofx><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dattamber Jukanti — Generative Field</title><link rel="stylesheet" href="base.css"><script src="theme.js"></script>
<style>
html,body{height:100%;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;z-index:3;border:0;background:linear-gradient(var(--bg),transparent)}
.ui{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:0 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 80%,transparent) 35%)}
#card{width:100%;max-width:680px;max-height:44vh;overflow:auto;background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--line);border-radius:8px;padding:14px 16px;backdrop-filter:blur(8px);display:none}
#card.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:760px}
#ask{display:flex;gap:8px;width:100%;max-width:680px}#ask input{flex:1}
.label{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:2;text-align:center;pointer-events:none}
.label h1{font:inherit;font-size:clamp(20px,3.6vw,30px);font-weight:700;margin:0}
.label p{margin:2px 0 0;color:var(--dim);font-size:13px}
#state{color:var(--acc)}
</style></head><body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="top"><span><a href="./">← previews</a> · Concept 3 · Generative field</span><span><b id="state" class="acc">idle</b></span></div>
<div class="label"><h1 id="ttl">Dattamber Jukanti</h1><p id="sub">Lead Software Engineer · ask the field</p></div>
<div class="ui"><div id="card" aria-live="polite"></div><div class="chips" id="chips"></div>
 <form id="ask"><input id="q" type="text" autocomplete="off" placeholder="Ask about performance, AI, leadership, the app…" aria-label="Ask"><button class="btn p" type="submit">Ask</button></form></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="data.js"></script>
<script>
const N=window.innerWidth<700?3500:6500, R=Math.random, TAU=Math.PI*2;
const S={
 galaxy:i=>{const arm=i%3,r=Math.pow(R(),.6)*5.5,a=r*1.15+arm*TAU/3+(R()-.5)*.35;return[Math.cos(a)*r,Math.sin(a)*r*.82,(R()-.5)*.6*(1-r/7)];},
 streams:i=>{const k=i%34,a=k*2.39996,rr=.5+(k%7)*.45;return[(R()-.5)*13,Math.cos(a)*rr+(R()-.5)*.12,Math.sin(a)*rr+(R()-.5)*.12];},
 split:i=>{const s=i%2?1:-1,u=R()*2-1,a=R()*TAU,q=Math.sqrt(1-u*u),r=1.5*Math.cbrt(R());return[s*2.2+r*q*Math.cos(a),r*u,r*q*Math.sin(a)];},
 network:i=>{const L=(i%5)-2,x=L*2.6; if(R()<.55){const gx=Math.floor(R()*4),gy=Math.floor(R()*4);return[x+(R()-.5)*.25,(gx-1.5)*1.3+(R()-.5)*.25,(gy-1.5)*1.3+(R()-.5)*.25];}
   const t=R(),a=[(Math.floor(R()*4)-1.5)*1.3,(Math.floor(R()*4)-1.5)*1.3],b=[(Math.floor(R()*4)-1.5)*1.3,(Math.floor(R()*4)-1.5)*1.3];return[x+t*2.6,a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];},
 tree:(()=>{const seg=[];(function g(x,y,a,l,d){ if(d>6) return; const nx=x+Math.sin(a)*l,ny=y+Math.cos(a)*l; seg.push([x,y,nx,ny,d]); g(nx,ny,a-.45-R()*.2,l*.74,d+1); g(nx,ny,a+.45+R()*.2,l*.74,d+1); })(0,-3.2,0,1.8,0);
   return i=>{const s=seg[Math.floor(Math.pow(R(),.7)*seg.length)],t=R(),z=(R()-.5)*(.6+s[4]*.25);return[s[0]+(s[2]-s[0])*t+(R()-.5)*.08,s[1]+(s[3]-s[1])*t,z];};})(),
 globe:i=>{ if(i%7===0){const a=R()*TAU;return[Math.cos(a)*4.4,Math.sin(a)*.5*Math.cos(1)+.3*Math.sin(a*3),Math.sin(a)*4.4];} const u=R()*2-1,a=R()*TAU,q=Math.sqrt(1-u*u),lat=Math.round(u*8)/8; const rr=Math.sqrt(1-lat*lat)*2.6; return[rr*Math.cos(a),lat*2.6+(R()-.5)*.03,rr*Math.sin(a)];},
 phone:i=>{const p=R(); if(p<.35){const e=Math.floor(R()*4),t=R(); const W=1.5,H=3; const pts=[[-W,-H,W,-H],[W,-H,W,H],[W,H,-W,H],[-W,H,-W,-H]][e]; return[pts[0]+(pts[2]-pts[0])*t,pts[1]+(pts[3]-pts[1])*t,(R()-.5)*.25];}
   const gx=Math.floor(R()*5),gy=Math.floor(R()*9); return[(gx-2)*.55+(R()-.5)*.1,(gy-4)*.62+(R()-.5)*.1,(R()-.5)*.1];},
 wave:i=>{const k=i%6,x=(R()-.5)*12;return[x,Math.sin(x*1.3+k)*Math.exp(-Math.abs(x)*.12)*1.3+(k-2.5)*.55,(k-2.5)*.35];},
 helix:i=>{const t=(R()-.5)*14,s=i%2?1:-1; if(i%9===0){const tt=Math.round(t*2)/2;return[tt,Math.cos(tt*1.2)*(R()*2-1)*1.6,Math.sin(tt*1.2)*(R()*2-1)*1.6];} return[t,Math.cos(t*1.2+(s>0?0:Math.PI))*1.6,Math.sin(t*1.2+(s>0?0:Math.PI))*1.6];},
 drift:i=>i%3?[0,0,40]:[(R()-.5)*16,(R()-.5)*9,(R()-.5)*6], // two thirds parked behind the camera: a sparse cloud
 lattice:i=>{const a=Math.floor(R()*5)-2,b=Math.floor(R()*5)-2,c=Math.floor(R()*5)-2; const m=R(); return m<.7?[a*1.2+(R()-.5)*.14,b*1.2+(R()-.5)*.14,c*1.2+(R()-.5)*.14]:[(a+R())*1.2,b*1.2,c*1.2];}
};
const DYN={drift:(i,t,v)=>{v[0]=((v[0]+8+t*(.35+(i%5)*.12))%16)-8;v[1]+=Math.sin(t*.5+i)*.25;v[2]+=Math.cos(t*.4+i*.7)*.2;},streams:(i,t,v)=>{v[0]=((v[0]+6.5+t*(.9+(i%5)*.35))%13)-6.5;},split:(i,t,v)=>{v[0]+=(i%2?1:-1)*(Math.sin(t*1.6)*1.4+.6-1.4*0+0);},wave:(i,t,v)=>{v[1]+=Math.sin(v[0]*1.3+t*3)*.25;},helix:(i,t,v)=>{const c=Math.cos(t*.8),s=Math.sin(t*.8),y=v[1],z=v[2];v[1]=y*c-z*s;v[2]=y*s+z*c;},galaxy:(i,t,v)=>{const a=t*.15,c=Math.cos(a),s=Math.sin(a),x=v[0],y=v[1];v[0]=x*c-y*s;v[1]=x*s+y*c;}};
const TOPICS=[
 {id:'ai',label:'AI-assisted delivery',shape:'network',kw:['ai','llm','agent','spec','model','token','genai','assist'],html:()=>projHTML(PROJECTS[0])},
 {id:'perf',label:'Performance',shape:'streams',kw:['latency','performance','fast','speed','slow','authorizer','lambda','eks'],html:()=>projHTML(PROJECTS[1])},
 {id:'resil',label:'Resilience',shape:'split',kw:['resilien','retry','circuit','outage','kafka','heal','vendor','reliab'],html:()=>projHTML(PROJECTS[2])},
 {id:'obs',label:'Observability',shape:'wave',kw:['observab','alert','monitor','grafana','prometheus','dashboard','splunk','metric'],html:()=>projHTML(PROJECTS[3])},
 {id:'data',label:'Data & keys',shape:'helix',kw:['uuid','key','database','postgres','aurora','active-active','sequence','data'],html:()=>projHTML(PROJECTS[4])},
 {id:'app',label:'The Dattavani app',shape:'phone',kw:['dattavani','app','mobile','store','ios','android','play','shipped','children','kids','product'],html:()=>projHTML(PROJECTS.find(p=>p.featured))},
 {id:'lead',label:'Leadership',shape:'tree',kw:['mentor','coach','lead','leader','leadership','people','grow','feedback','team','principle','decision'],html:()=>DATA.roles[0].pts.slice(-1)[0]&&`<h3>How he leads</h3>${principlesHTML()}<p>Mentoring is about the thinking, not the answer: associates promoted to pod lead, seniors owning run-the-engine, early-career engineers shipping reference implementations other teams copied.</p>`},
 {id:'skills',label:'Skills',shape:'lattice',kw:['skill','stack','tech','language','tool','java','react','kubernetes','terraform','aws'],html:()=>`<h3>Skills</h3>${skillsHTML()}`},
 {id:'life',label:'Beyond the code',shape:'globe',kw:['life','hobby','travel','volunteer','family','fun','personal','outside'],html:()=>`<h3>Beyond the code</h3>${lifeHTML()}`},
 {id:'about',label:'About',shape:'galaxy',kw:['about','who','intro','background','summary','career','experience','role'],html:()=>`<h3>About</h3>${aboutHTML()}${rolesHTML()}${contactHTML()}`}
];
const cv=document.getElementById('gl'); let r; try{ r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true}); }catch(_){ document.body.insertAdjacentHTML('beforeend','<p style="padding:90px 16px">WebGL unavailable. See the <a href="../">main site</a>.</p>'); }
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(55,1,.1,100); cam.position.set(0,0,11);
const pos=new Float32Array(N*3), col=new Float32Array(N*3), tgt=new Float32Array(N*3); let acc=new THREE.Color(), cur='galaxy';
const readAcc=()=>acc.set(getComputedStyle(document.documentElement).getPropertyValue('--acc').trim());
readAcc();
const bright=new Float32Array(N).map(()=>.4+R()*.6);
const setColors=()=>{ const base=window.THEME&&window.THEME.light?.85:.1; for(let i=0;i<N;i++){ const w=bright[i]; col[i*3]=acc.r*w+(1-w)*base; col[i*3+1]=acc.g*w+(1-w)*base; col[i*3+2]=acc.b*w+(1-w)*base; } g.attributes.color.needsUpdate=true; };
const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('color',new THREE.BufferAttribute(col,3));
const mat=new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.95,depthWrite:false,blending:window.THEME&&window.THEME.light?THREE.NormalBlending:THREE.AdditiveBlending,sizeAttenuation:true});
const pts=new THREE.Points(g,mat); scene.add(pts); setColors();
let want='galaxy';
function shape(name){ want=name; if(name==='galaxy'&&window.THEME&&window.THEME.name==='sakura') name='drift'; cur=name; mat.size=name==='drift'?.07:.045; mat.opacity=name==='drift'?.7:.95; for(let i=0;i<N;i++){ const v=S[name](i); tgt[i*3]=v[0]; tgt[i*3+1]=v[1]; tgt[i*3+2]=v[2]; } }
shape('galaxy'); for(let i=0;i<N*3;i++) pos[i]=(R()-.5)*14;
let px=0,py=0,last=0,tm=0; addEventListener('pointermove',e=>{px=e.clientX/innerWidth*2-1; py=e.clientY/innerHeight*2-1;});
const resize=()=>{ r.setSize(innerWidth,innerHeight,false); r.setPixelRatio(Math.min(devicePixelRatio,2)); cam.aspect=innerWidth/innerHeight; cam.position.z=innerWidth<700?15:11; cam.updateProjectionMatrix(); }; resize(); addEventListener('resize',resize);
const v=[0,0,0]; let speed=.045,vis=true; new IntersectionObserver(e=>vis=e[0].isIntersecting).observe(cv);
function frame(t){ if(!calm) requestAnimationFrame(frame); if(!vis||document.hidden) return; const dt=Math.min(.05,(t-last)/1000||0); last=t; tm+=dt; const dyn=DYN[cur];
  for(let i=0;i<N;i++){ const k=i*3; v[0]=tgt[k]; v[1]=tgt[k+1]; v[2]=tgt[k+2]; if(dyn) dyn(i,tm,v);
    if(Math.abs(v[0]-pos[k])>14.5) pos[k]=v[0]; pos[k]+=(v[0]-pos[k])*speed; pos[k+1]+=(v[1]-pos[k+1])*speed; pos[k+2]+=(v[2]-pos[k+2])*speed; }
  g.attributes.position.needsUpdate=true; pts.rotation.y+=(px*.6-pts.rotation.y)*.03+dt*.05; pts.rotation.x+=(py*.35-pts.rotation.x)*.03;
  if(Math.floor(tm*2)%60===0) { const prev=acc.getHex(); readAcc(); if(acc.getHex()!==prev) setColors(); }
  r.render(scene,cam); }
if(calm){ for(let i=0;i<N*3;i++) pos[i]=tgt[i]; g.attributes.position.needsUpdate=true; r.render(scene,cam);} else requestAnimationFrame(frame);
addEventListener('themechange',()=>{ readAcc(); setColors(); mat.blending=window.THEME.light?THREE.NormalBlending:THREE.AdditiveBlending; mat.needsUpdate=true; if(want==='galaxy') shape('galaxy'); });
// UI: ask -> morph + streamed answer
const card=document.getElementById('card'), st=document.getElementById('state'), ttl=document.getElementById('ttl'), sub=document.getElementById('sub');
function stream(el,done){ const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[]; while(w.nextNode()) ns.push(w.currentNode); const full=ns.map(n=>n.nodeValue); ns.forEach(n=>n.nodeValue=''); const words=full.map(s=>s.match(/\S+\s*|\s+/g)||[]); let i=0,j=0;
  (function tick(){ if(i>=ns.length) return done&&done(); const n=1+(R()*3|0); ns[i].nodeValue+=words[i].slice(j,j+n).join(''); j+=n; if(j>=words[i].length){i++;j=0;} card.scrollTop=card.scrollHeight; setTimeout(tick,16+R()*26); })(); }
function show(t){ st.textContent='thinking…'; speed=.12; card.classList.add('on'); card.innerHTML='<span class="dim">resolving…</span>'; shape(t.shape); ttl.textContent=t.label; sub.textContent='';
  setTimeout(()=>{ speed=.045; st.textContent='answering'; card.innerHTML=t.html(); if(calm){ st.textContent='idle'; return; } stream(card,()=>st.textContent='idle'); }, calm?0:500+R()*400); }
function ask(q){ q=q.trim(); if(!q) return; let best=null,top=0; TOPICS.forEach(t=>{ const s=scoreOf(q,t.kw); if(s>top){top=s;best=t;} });
  if(best) show(best); else { shape('galaxy'); ttl.textContent='Not in the brief'; card.classList.add('on'); card.innerHTML='<p>Nothing on that. Try one of the topics below.</p>'; } }
document.getElementById('ask').onsubmit=e=>{ e.preventDefault(); const i=document.getElementById('q'); ask(i.value); i.value=''; };
TOPICS.forEach(t=>{ const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=t.label; b.onclick=()=>show(t); document.getElementById('chips').appendChild(b); });
</script></body></html>
